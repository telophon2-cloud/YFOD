[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  included_files = ["public/*.html"]

[[redirects]]
  from = "/"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/upload-chunk"
  to = "/.netlify/functions/upload-chunk"
  status = 200

[[redirects]]
  from = "/stream"
  to = "/.netlify/functions/stream"
  status = 200
