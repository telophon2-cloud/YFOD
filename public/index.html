<script>
var allVideos = [];

function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function getParam(name) {
  var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
}

function showPlayer(id) {
  var v = null;
  for (var i = 0; i < allVideos.length; i++) {
    if (allVideos[i].id === id) { v = allVideos[i]; break; }
  }
  if (!v) return;

  var streamUrl = "/api/stream?id=" + encodeURIComponent(v.id);
  var html = '<h2>Просмотр: ' + esc(v.title) + '</h2>' +
    '<table border="1" cellpadding="4" cellspacing="0" bgcolor="#000000"><tr><td>' +
    '<video width="480" height="360" controls controlsList="nodownload" preload="metadata">' +
    '<source src="' + streamUrl + '" type="video/mp4">' +
    '<embed src="' + streamUrl + '" width="480" height="360" autostart="true" showcontrols="true">' +
    '</video></td></tr></table>' +
    '<p><b>Автор:</b> ' + esc(v.author) + ' | <b>Просмотров:</b> ' + (v.views + 1) +
    ' | <b>Дата:</b> ' + esc(v.date) + ' | <b>Размер:</b> ' + esc(v.sizeMB) + ' МБ</p>' +
    '<p><a href="/">[ Закрыть плеер ]</a></p><hr>';

  document.getElementById("player-area").innerHTML = html;

  var x = window.XMLHttpRequest ? new XMLHttpRequest() : new ActiveXObject("Microsoft.XMLHTTP");
  x.open("GET", "/api/videos?view=" + encodeURIComponent(id) + "&t=" + new Date().getTime(), true);
  x.send();
}

function renderList() {
  var q = (document.getElementById("search-input").value || "").toLowerCase();
  var list = [];
  for (var i = 0; i < allVideos.length; i++) {
    if (!q || allVideos[i].title.toLowerCase().indexOf(q) !== -1) {
      list.push(allVideos[i]);
    }
  }

  var box = document.getElementById("video-list");
  if (list.length === 0) {
    box.innerHTML = "<p>Видео пока нет.</p>";
    return;
  }

  var h = '<table width="100%" border="1" cellpadding="6" cellspacing="0">' +
    '<tr bgcolor="#EEEEEE"><th align="left">Формат</th><th align="left">Название</th>' +
    '<th align="left">Автор</th><th align="left">Просмотры</th><th align="left">Дата</th><th align="left">Размер</th></tr>';

  for (var j = 0; j < list.length; j++) {
    var item = list[j];
    h += '<tr><td><b>[MP4]</b></td>' +
      '<td><a href="/?watch=' + encodeURIComponent(item.id) + '"><b>' + esc(item.title) + '</b></a></td>' +
      '<td>' + esc(item.author) + '</td>' +
      '<td>' + item.views + '</td>' +
      '<td>' + esc(item.date) + '</td>' +
      '<td>' + esc(item.sizeMB) + ' МБ</td></tr>';
  }
  h += '</table>';
  box.innerHTML = h;
}

var req = window.XMLHttpRequest ? new XMLHttpRequest() : new ActiveXObject("Microsoft.XMLHTTP");
req.open("GET", "/api/videos?t=" + new Date().getTime(), true);
req.onreadystatechange = function() {
  if (req.readyState === 4) {
    if (req.status === 200) {
      allVideos = window.JSON ? JSON.parse(req.responseText) : eval("(" + req.responseText + ")");
      var qParam = getParam("q");
      if (qParam) document.getElementById("search-input").value = qParam;
      renderList();
      var watchId = getParam("watch");
      if (watchId) showPlayer(watchId);
    } else {
      document.getElementById("video-list").innerHTML = "<p>Ошибка загрузки списка (" + req.status + ").</p>";
    }
  }
};
req.send();
</script>
