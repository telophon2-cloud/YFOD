<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Youtube For Old Devices - YFOD</title>
</head>
<body bgcolor="#FFFFFF" text="#000000" link="#0000CC" vlink="#551A8B">

<table width="100%" border="1" cellpadding="8" cellspacing="0" bgcolor="#CC181E">
  <tr>
    <td>
      <font color="#FFFFFF" size="5"><b>YFOD — Youtube For Old Devices</b></font><br>
      <font color="#FFDDDD" size="2">Видеохостинг для старых устройств. Без CSS.</font>
    </td>
  </tr>
</table>

<br>

<table width="100%" border="0" cellpadding="4" cellspacing="0">
  <tr>
    <td>
      <a href="/"><b>[ Главная ]</b></a> &nbsp;|&nbsp;
      <a href="/upload.html"><b>[ + Загрузить видео (до 20 МБ) ]</b></a>
    </td>
    <td align="right">
      <form method="GET" action="/">
        <input type="text" id="search-input" name="q" placeholder="Поиск видео...">
        <input type="button" value="Найти" onclick="renderList()">
      </form>
    </td>
  </tr>
</table>

<hr>

<div id="player-area"></div>

<h2>Новые видео</h2>
<div id="video-list">Загрузка списка видео...</div>

<br>
<hr>
<center>
  <font size="2" color="#666666">Youtube For Old Devices (YFOD) — легкий HTML без CSS.</font>
</center>

<script>
var allVideos = [];

function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function getParam(name) {
  var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
}

function showPlayer(id) {
  var v = null;
  for (var i = 0; i < allVideos.length; i++) {
    if (allVideos[i].id === id) { v = allVideos[i]; break; }
  }
  if (!v) return;

  var html = '<h2>Просмотр: ' + esc(v.title) + '</h2>' +
    '<table border="1" cellpadding="4" cellspacing="0" bgcolor="#000000"><tr><td>' +
    '<video width="480" height="360" controls controlsList="nodownload" preload="metadata">' +
    '<source src="/api/stream?id=' + encodeURIComponent(v.id) + '" type="video/mp4">' +
    'Ваш браузер не поддерживает HTML5 video.</video></td></tr></table>' +
    '<p><b>Автор:</b> ' + esc(v.author) + ' | <b>Просмотров:</b> ' + (v.views + 1) +
    ' | <b>Дата:</b> ' + esc(v.date) + ' | <b>Размер:</b> ' + esc(v.sizeMB) + ' МБ</p>' +
    '<p><a href="/">[ Закрыть плеер ]</a></p><hr>';

  document.getElementById("player-area").innerHTML = html;

  var xhr = new XMLHttpRequest();
  xhr.open("GET", "/api/videos?view=" + encodeURIComponent(id), true);
  xhr.send();
}

function renderList() {
  var q = (document.getElementById("search-input").value || "").toLowerCase();
  var list = [];
  for (var i = 0; i < allVideos.length; i++) {
    if (!q || allVideos[i].title.toLowerCase().indexOf(q) !== -1) {
      list.push(allVideos[i]);
    }
  }

  var box = document.getElementById("video-list");
  if (list.length === 0) {
    box.innerHTML = "<p>Видео пока нет.</p>";
    return;
  }

  var h = '<table width="100%" border="1" cellpadding="6" cellspacing="0">' +
    '<tr bgcolor="#EEEEEE"><th align="left">Формат</th><th align="left">Название</th>' +
    '<th align="left">Автор</th><th align="left">Просмотры</th><th align="left">Дата</th><th align="left">Размер</th></tr>';

  for (var j = 0; j < list.length; j++) {
    var item = list[j];
    h += '<tr><td><b>[MP4]</b></td>' +
      '<td><a href="/?watch=' + encodeURIComponent(item.id) + '"><b>' + esc(item.title) + '</b></a></td>' +
      '<td>' + esc(item.author) + '</td>' +
      '<td>' + item.views + '</td>' +
      '<td>' + esc(item.date) + '</td>' +
      '<td>' + esc(item.sizeMB) + ' МБ</td></tr>';
  }
  h += '</table>';
  box.innerHTML = h;
}

var req = new XMLHttpRequest();
req.open("GET", "/api/videos", true);
req.onreadystatechange = function() {
  if (req.readyState === 4) {
    if (req.status === 200) {
      allVideos = JSON.parse(req.responseText);
      var qParam = getParam("q");
      if (qParam) document.getElementById("search-input").value = qParam;
      renderList();
      var watchId = getParam("watch");
      if (watchId) showPlayer(watchId);
    } else {
      document.getElementById("video-list").innerHTML = "<p>Ошибка загрузки списка (" + req.status + ").</p>";
    }
  }
};
req.send();
</script>

</body>
</html>
